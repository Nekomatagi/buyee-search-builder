<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buyee Search Builder</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="update" class="update" hidden>
  <span id="updateText">A new version is ready.</span>
  <button id="updateBtn" type="button">Update now</button>
</div>

<main class="wrap">
  <p class="kick">Japanese second-hand sourcing tool</p>
  <h1>Buyee search builder</h1>

  <section>
    <h2>1. Product</h2>
    <label class="lbl" for="en">English (or type Japanese directly)</label>
    <input id="en" type="text" autocomplete="off" spellcheck="false" placeholder="e.g. cassette walkman">
    <div class="ja-box">
      <div class="ja-head">
        <label class="lbl" for="ja">Japanese</label>
        <span id="src" class="src"></span>
      </div>
      <input id="ja" type="text" autocomplete="off" spellcheck="false" lang="ja" placeholder="Appears here">
      <p id="jaRomaji" class="romaji"></p>
    </div>

    <div class="row-head">
      <span class="lbl">Quick presets</span>
      <span>
        <button id="addPreset" class="link" type="button">+ Add current</button>
        <button id="editPresets" class="link" type="button">Edit</button>
      </span>
    </div>
    <div id="presets" class="presets"></div>
  </section>

  <section>
    <h2>2. Selling condition</h2>
    <select id="cond"></select>
    <h2>3. Selling format</h2>
    <select id="fmt"></select>
    <h2>4. Additional filter</h2>
    <select id="ext"></select>
    <button id="toggleFilter" class="link add-filter" type="button">+ Add custom filter</button>
    <div id="filterPanel" class="panel" hidden>
      <label class="lbl" for="fEn">Filter in English or Japanese</label>
      <input id="fEn" type="text" autocomplete="off" placeholder="e.g. with charger">
      <div class="ja-head"><span class="lbl">Japanese</span><span id="fSrc" class="src"></span></div>
      <input id="fJa" type="text" autocomplete="off" lang="ja" placeholder="Appears here">
      <p id="fRomaji" class="romaji"></p>
      <div class="panel-btns">
        <button id="saveFilter" class="pri" type="button">Add filter</button>
        <button id="cancelFilter" class="link" type="button">Cancel</button>
      </div>
    </div>
  </section>

  <section class="out">
    <div class="out-head"><b>Your Japanese search query</b><span class="tag">Generated</span></div>
    <p id="q" class="q" lang="ja"></p>
    <p id="qRomaji" class="romaji q-romaji"></p>
    <div class="btns">
      <button id="copy" class="pri" type="button">Copy Japanese query</button>
      <button id="open" type="button">Open on Buyee</button>
    </div>
    <div class="foot">
      <p id="msg" class="hint">Paste into Buyee's search bar.</p>
      <button id="reset" class="link" type="button">Reset</button>
    </div>
  </section>

  <p id="ver" class="ver"></p>
</main>

<script src="js/vendor/neutralino.js"></script>
<script src="js/vendor/kuroshiro.min.js"></script>
<script src="js/vendor/kuroshiro-analyzer-kuromoji.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
